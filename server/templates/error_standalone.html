<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.TitleTag}}</title>
<link rel="preload" as="image" href="{{ URLErrorImage .Code }}" fetchpriority="high">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    color: #c9d1d9;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
    text-align: center;
    padding: 20px;
}
.card {
    width: 360px;
    height: 360px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: none;
}
.card-content {
    flex: 1;
    width: 100%;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.badge {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid {{.Accent}};
    margin-bottom: 20px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: {{.BoxShadow}};
    display: flex;
    align-items: center;
    justify-content: center;
}
.badge img {
    width: {{.ImgScale}};
    height: {{.ImgScale}};
    object-fit: contain;
    display: block;
}
.pill {
    display: inline-block;
    padding: 3px 10px;
    background: {{.PillBg}};
    border: 1.5px solid {{.PillBorder}};
    border-radius: 999px;
    color: {{.Accent}};
    font-size: 11px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 12px;
}
h2 {
    font-size: 18px;
    line-height: 1;
    font-weight: 600;
    color: #f0f6fc;
    letter-spacing: -0.3px;
    white-space: nowrap;
    margin: 0 0 12px;
}
.colored-desc {
    font-size: 14px;
    line-height: 1;
    font-weight: 600;
    color: {{.Accent}};
    letter-spacing: 0.3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-bottom: 0;
{{if .Glitch}}
    display: inline-block;
    animation: horrorGlitch 2.2s infinite;
{{end}}
}
{{if .Glitch}}
@keyframes horrorGlitch {
    0%, 100% { transform: translate(0); text-shadow: none; opacity: 1; }
    15% { transform: translate(-2px, 1px) skewX(-4deg); text-shadow: -2.5px 0 #ff0055, 2.5px 0 #00ffff; opacity: 0.85; }
    17% { transform: translate(2px, -1px); text-shadow: 2.5px 0 #ff0055, -2.5px 0 #00ffff; opacity: 0.6; }
    19% { transform: translate(0); text-shadow: none; opacity: 1; }
    55% { transform: translate(-1.5px, 0); text-shadow: -2px 0 #ff4d4f, 1.5px 0 #00ffff; opacity: 0.7; }
    57% { transform: translate(0); text-shadow: none; opacity: 1; }
    78% { opacity: 0.35; transform: skewX(5deg); text-shadow: -3px 0 #ff0055; }
    80% { opacity: 1; transform: skewX(0); text-shadow: none; }
    82% { transform: translate(2px, 0.5px); text-shadow: 3px 0 #ff0055, -1.5px 0 #00ffff; }
    84% { transform: translate(0); text-shadow: none; }
}
{{end}}
.btn {
    width: 100%;
    padding: 13px 0;
    background: #21262d;
    color: #c9d1d9;
    border: none;
    border-top: 1px solid #30363d;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    transition: all 0.2s;
    flex-shrink: 0;
}
.btn svg {
    display: block;
    width: 14px;
    height: 14px;
    fill: currentColor;
    flex-shrink: 0;
}
.btn:hover {
    background: #292e36;
    color: {{.Accent}};
}
.sym {
    display: inline-block;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    font-style: normal;
    font-weight: inherit;
    margin-left: 2px;
}
.pill .fun-dot {
    display: inline-block;
    margin: 0 4px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: inherit;
    vertical-align: baseline;
    opacity: 0.85;
}
.pill .fun-space {
    display: inline-block;
    width: 4px;
}
.colored-desc .fun-dot {
    display: inline-block;
    margin: 0 6px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: inherit;
    vertical-align: baseline;
    opacity: 0.85;
}
.colored-desc .fun-space {
    display: inline-block;
    width: 6px;
}
</style>
</head>
<body>
    <div class="card">
        <div class="card-content">
            <div class="badge">
                <img src="{{ URLErrorImage .Code }}" alt="{{.Code}}" fetchpriority="high" decoding="sync">
            </div>
            <div class="pill">{{safeHTML .Pill}}</div>
            <h2>{{safeHTML .Title}}</h2>
            <div class="colored-desc">{{safeHTML .Desc}}</div>
        </div>
        <a href="{{.Link}}" class="btn"><span>{{safeHTML .Btn}}</span>{{svg "arrow-right"}}</a>
    </div>
</body>
</html>
