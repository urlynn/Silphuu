[package]
name = "silphd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
# The "quinn" feature gates the custom-transport entry points (with_custom_transport /
# with_custom_tls_and_transport) and the quinn re-export. The idle policy on the sync link has
# to replace quinn's transport defaults, and wtransport's shorthand builders fix those
# defaults, so the feature is required.
wtransport = { version = "0.7.2", features = ["quinn"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
hex = "0.4.3"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
brotli = "8.0.4"
zstd = "0.13"
libc = "0.2"
chrono = "0.4"
