# Development reverse proxy for the example site.
#
# The engine listens on a unix socket and nothing else: SILPHUU_SOCK is required, and the
# process exits when it is unset. There is no port flag, so a reverse proxy is not an
# optional convenience here — without one there is no URL to open at all.
#
# SECURITY WARNING & ADMIN MODEL:
# isAdmin(r) is simply `r.Header.Get("X-Is-Admin") == "1"`. The engine trusts the reverse
# proxy completely. It is NOT a password login. 
#
# IN PRODUCTION:
# You must bind to a single port (e.g., 80/443) and strictly control the `X-Is-Admin` header:
# 1. ALWAYS strip the `X-Is-Admin` header from incoming client requests to prevent spoofing.
# 2. Inject `X-Is-Admin: 1` ONLY after your own authentication (e.g., auth_basic, OAuth2, 
#    or restricted admin subdomains/IP whitelists).
#
# IN DEVELOPMENT (This file):
# For local convenience, this config uses two ports on the loopback address (127.0.0.1) 
# to let you preview both states easily:
#   :80    injects X-Is-Admin: 1   (Admin View)
#   :8080  strips X-Is-Admin       (Visitor View)
#
# Run the engine against whichever site you want to look at, e.g.
#   cd server && SILPHUU_SOCK=/tmp/silphuu.sock ../bin/silphuu -dir ../examples/demo
# or use `make run` / `make run-site DIR=...`, which set both.
#
# early_hints on forwards the 103 responses the engine emits. It needs nginx >= 1.29.0; on
# an older build nginx refuses to start with `unknown directive`. Drop the line in that
# case — the site still works, it just loses the preload hints. 

# Admin entry (Development only). The socket path here must match SILPHUU_SOCK.
server {
    listen 127.0.0.1:80;
    server_name localhost;

    location / {
        early_hints on;
        proxy_pass http://unix:/tmp/silphuu.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # INJECT admin header for local admin access.
        proxy_set_header X-Is-Admin 1;
    }
}

# Visitor entry. The same proxy, minus the admin header.
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location / {
        early_hints on;
        proxy_pass http://unix:/tmp/silphuu.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # STRIP any spoofed admin header from the client.
        # This is CRITICAL in production.
        proxy_set_header X-Is-Admin "";
    }
}
